services:
  
  Chiron:
    build:
          context: ./chiron
          dockerfile: Dockerfile
    container_name: Chiron
    restart: unless-stopped
    ports:
          - "8080:8080"
    environment:
          - AUTOGLUON_SERVICE_URL=http://autogluon:8001
    depends_on:
          - autogluon
    networks:
          - chiron-network
    
  autogluon:
    image: autogluon/autogluon:1.3.1-cpu-framework-ubuntu22.04-py3.11
    container_name: autogluon
    restart: unless-stopped
    working_dir: /app
    volumes:
          - ./ml_worker:/app
          - ./trained_model:/app/AutogluonModels

    command: >
      sh -c "pip install -q fastapi 'uvicorn[standard]' &&
             uvicorn ml_service:app --host 0.0.0.0 --port 8001"
    ports:
          - "8001:8001"
    networks:
          - chiron-network

networks:
  chiron-network:
    driver: bridge