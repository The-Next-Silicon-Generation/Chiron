<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHIRÓN Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#040c20; --panel:#0a1a3c; --panel2:#0d2150; --line:#1b3a73;
  --text:#eaf3ff; --mute:#8fb0e0; --accent:#4da3ff;
  --green:#3ddc97; --amber:#ffb938; --red:#ff5d6c;
  --mono:'Roboto Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(1200px 600px at 50% -10%,#0c2a63 0%,var(--bg) 60%);color:var(--text);font-family:var(--mono);min-height:100vh;padding:16px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Encabezado */
header{display:flex;align-items:center;gap:16px;border-bottom:2px solid var(--accent);padding-bottom:10px;margin-bottom:12px;flex-wrap:wrap}
h1{font-size:22px;font-weight:700;letter-spacing:.08em;flex:1;text-align:center;min-width:180px}
.pill{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 12px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mute);flex:none}
.pill[data-s=ok] .dot{background:var(--green)} .pill[data-s=wait] .dot,.pill[data-s=demo] .dot{background:var(--amber)} .pill[data-s=bad] .dot{background:var(--red)}
.profile{width:40px;height:40px;border-radius:50%;background:#1b4a8f;border:2px solid var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px}

/* Astronautas */
#crew{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}
.chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;white-space:nowrap;transition:.2s}
.chip small{color:var(--mute)}
.chip[aria-pressed=true]{background:var(--panel2);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.chip .dot{background:var(--c)}

/* Rejilla */
main{display:grid;grid-template-columns:minmax(300px,1.15fr) minmax(240px,.75fr) minmax(300px,1fr);gap:16px;align-items:stretch}
h2{font-size:15px;font-weight:500;color:var(--mute);margin-bottom:10px}

/* Tarjetas de gráfica */
#cards{display:flex;flex-direction:column;gap:10px}
.card{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px 8px;transition:.2s;position:relative}
.card:hover{border-color:#3b6dc0}
.card.sel{border-color:var(--accent);background:var(--panel2);box-shadow:0 0 0 1px var(--accent)}
.card .top{display:flex;align-items:baseline;gap:8px}
.card .nm{font-size:14px;font-weight:500;flex:1}
.card .val{font-size:28px;font-weight:700;line-height:1}
.card .un{font-size:12px;color:var(--mute)}
.card .dot{background:var(--c);align-self:center}
.card svg{width:100%;height:64px;display:block;margin-top:4px;touch-action:none}
.card .hv{position:absolute;right:14px;bottom:8px;font-size:11px;color:var(--mute);pointer-events:none}
.band{fill:var(--green);opacity:.1}
.ln{fill:none;stroke:#67b6ff;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ar{fill:url(#g);stroke:none}
.cur{stroke:#cfe5ff;stroke-width:1;opacity:0}

/* Astronauta */
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center}
#astro{width:100%;max-width:260px;height:auto}
.body{fill:#0b1d44;stroke:#3f78cf;stroke-width:2}
.z{fill:var(--c,#27457f);fill-opacity:.3;stroke:var(--c,#27457f);stroke-opacity:.6;stroke-width:2;cursor:pointer;transition:fill-opacity .3s}
.z:hover{fill-opacity:.5}
.z.sel{stroke:#fff;stroke-opacity:1;stroke-width:3}
.z.red{animation:pu 1.6s ease-in-out infinite}
@keyframes pu{50%{fill-opacity:.5}}
.cap{font-size:12px;color:var(--mute);text-align:center;margin-top:8px;min-height:36px;max-width:260px}
.cap b{color:var(--text);font-size:15px}

/* Clasificador */
.cls{--c:var(--line);position:relative;background:var(--panel);border:2px solid var(--c);border-radius:18px;padding:16px 16px 44px;display:flex;flex-direction:column;min-height:420px}
.cls[data-t=green]{--c:var(--green)} .cls[data-t=amber]{--c:var(--amber)} .cls[data-t=red]{--c:var(--red)}
.cls .hint{color:var(--mute);font-size:13px}
.cls .desc{display:none;font-size:13px;line-height:1.55;overflow:auto;max-height:520px}
.cls.open .desc{display:block;animation:in .3s ease}
.cls.open .hint{display:none}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.desc h3{font-size:16px;color:var(--c);margin-bottom:6px}
.desc p{margin-bottom:10px}
.desc ul{list-style:none;padding:0}
.desc li{padding:8px 0;border-top:1px solid var(--line)}
.desc li i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--c)}
.desc .note{color:var(--mute);font-size:11px;margin-top:10px}
.cbtn{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);min-width:210px;padding:12px 22px;border-radius:99px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 28%,#07142f);font-weight:700;font-size:15px;letter-spacing:.06em;line-height:1.2;transition:.2s}
.cbtn small{display:block;font-weight:400;font-size:11px;letter-spacing:0}
.cbtn:hover{background:color-mix(in srgb,var(--c) 42%,#07142f)}

@media (max-width:1000px){main{grid-template-columns:1fr}.cls{margin-bottom:30px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="pill" id="conn" data-s="wait"><span class="dot"></span><span id="connT">Conectando…</span></div>
  <h1>CHIRÓN Monitor</h1>
  <div class="profile" title="Perfil del operador">OP</div>
</header>

<nav id="crew" aria-label="Astronautas"></nav>

<main>
  <section><h2>Signos vitales</h2><div id="cards"></div></section>

  <section class="mid">
    <svg id="astro" viewBox="0 0 240 420" role="img" aria-label="Astronauta con señalética por zona">
      <ellipse class="body" cx="97" cy="390" rx="30" ry="14"/><ellipse class="body" cx="143" cy="390" rx="30" ry="14"/>
      <rect class="body" x="40" y="146" width="26" height="100" rx="13"/><rect class="body" x="174" y="146" width="26" height="100" rx="13"/>
      <ellipse class="body" cx="53" cy="256" rx="15" ry="12"/><ellipse class="body" cx="187" cy="256" rx="15" ry="12"/>
      <rect class="body" x="108" y="126" width="24" height="18" rx="4"/>
      <circle class="body" cx="120" cy="70" r="58"/>
      <ellipse class="z" data-k="spo2" cx="120" cy="72" rx="40" ry="32"/>
      <rect class="z" data-k="rr" x="70" y="142" width="100" height="62" rx="14"/>
      <rect class="z" data-k="urine" x="70" y="208" width="100" height="56" rx="14"/>
      <circle class="z" data-k="hr" cx="104" cy="174" r="17"/>
      <text x="104" y="180" text-anchor="middle" font-size="18" fill="#eaf3ff" pointer-events="none">♥</text>
      <rect class="z" data-k="bv" x="78" y="270" width="38" height="108" rx="16"/>
      <rect class="z" data-k="bv" x="124" y="270" width="38" height="108" rx="16"/>
    </svg>
    <div class="cap" id="cap">Toca una zona del astronauta para ver su gráfica.</div>
  </section>

  <section>
    <h2>Interpretación</h2>
    <div class="cls" id="cls" data-t="green">
      <p class="hint">Toca CLASIFICADOR para ver qué podría estar pasando según los rangos actuales.</p>
      <div class="desc" id="desc" aria-live="polite"></div>
      <button class="cbtn" id="cbtn" aria-expanded="false">CLASIFICADOR<small id="cbtnT">—</small></button>
    </div>
  </section>
</main>

<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4da3ff" stop-opacity=".35"/><stop offset="1" stop-color="#4da3ff" stop-opacity="0"/></linearGradient></defs></svg>

<script>
/* ============ CONFIGURACIÓN ============
   ?mode=ws | mock   &url=...
   Transporte en vivo: solo WebSocket (CONV §1). "mock" = demo sin red (no contacta al backend).
   Formato esperado del backend (un objeto o un arreglo de objetos):
   { "astronaut_id":"A-01", "name":"Ares", "ts":1731700000000,
     "vitals":{ "spo2":97, "hr":74, "rr":16, "urine":52, "bv":98 },
     "ml":{ "triage":"green|amber|red", "label":"texto del modelo", "prob":0.91,
            "flags":{ "spo2":"green", "hr":"amber" } } }      <- "ml" es opcional
   Si llega "ml.triage" manda el modelo; si no, se calcula con los rangos de VARS. */
const Q = new URLSearchParams(location.search);
const CONFIG = {
  mode: Q.get('mode') || 'ws',
  url: Q.get('url') || 'ws://localhost:8080/ws/vitals',
  window: 60,          // puntos visibles por gráfica
  staleMs: 5000        // sin datos => "Sin señal"
};

/* ============ VARIABLES Y RANGOS (g = verde, a = ámbar, fuera = rojo) ============ */
const VARS = [
  {k:'spo2',  name:'SpO₂',                unit:'%',         g:[95,100], a:[90,100], min:80, max:100, zone:'cabeza'},
  {k:'hr',    name:'Frecuencia cardiaca', unit:'lpm',       g:[60,100], a:[50,120], min:30, max:160, zone:'corazón'},
  {k:'rr',    name:'Frecuencia respiratoria', unit:'rpm',   g:[12,20],  a:[8,24],   min:4,  max:34,  zone:'tórax'},
  {k:'urine', name:'Uresis (volumen)',    unit:'mL/h',      g:[30,100], a:[15,150], min:0,  max:200, zone:'riñón / abdomen'},
  {k:'bv',    name:'Volumen sanguíneo',   unit:'% del basal', g:[90,110], a:[80,120], min:60, max:130, zone:'piernas / circulación'}
];
const COL = {green:'#3ddc97', amber:'#ffb938', red:'#ff5d6c'};
const RANK = {green:0, amber:1, red:2};
const LABEL = {green:'VERDE · rangos normales', amber:'ÁMBAR · vigilar', red:'ROJO · atención inmediata'};
const MSG = { // [bajo, alto] → [ámbar, rojo]
  spo2:[[ 'Saturación algo baja: posible hipoventilación leve, esfuerzo o menos oxígeno en traje/cabina.','Hipoxemia marcada: riesgo de hipoxia. Revisar suministro de O₂, vía aérea y ventilación.']],
  hr:[['Pulso algo bajo: posible fatiga, relajación profunda o efecto de fármacos.','Bradicardia importante: riesgo de bajo gasto cardiaco. Valorar de inmediato.'],
      ['Pulso elevado: posible esfuerzo, estrés, dolor o deshidratación leve.','Taquicardia marcada: posible hipovolemia, arritmia o estrés severo.']],
  rr:[['Respiración lenta: posible sedación o fatiga.','Respiración muy lenta: riesgo de hipoventilación y exceso de CO₂.'],
      ['Respiración acelerada: posible esfuerzo, ansiedad o aumento de CO₂.','Respiración muy acelerada: posible falla respiratoria, CO₂ alto o acidosis.']],
  urine:[['Orina baja: posible deshidratación o menor flujo a los riñones.','Orina casi nula: riesgo de hipovolemia o daño renal. Revisar hidratación.'],
         ['Orina alta: posible exceso de líquidos o redistribución de fluidos por microgravedad.','Orina muy alta: riesgo de deshidratación y pérdida de electrolitos.']],
  bv:[['Volumen algo bajo: posible deshidratación o redistribución de fluidos.','Pérdida importante de volumen: posible hemorragia o hipovolemia severa. Atención inmediata.'],
      ['Volumen algo alto: posible sobrecarga de líquidos o redistribución de fluidos.','Volumen muy alto: posible sobrecarga de volumen (hipervolemia). Valorar de inmediato.']]
};

/* ============ ESTADO ============ */
const $ = s => document.querySelector(s);
const S = {crew:new Map(), sel:null, vk:'spo2', open:false, last:0};
let dirty = false;

const rate = (v,x) => (x>=v.g[0] && x<=v.g[1]) ? 'green' : (x>=v.a[0] && x<=v.a[1]) ? 'amber' : 'red';
const isTri = s => Object.prototype.hasOwnProperty.call(RANK, s);   // green/amber/red
const worst = st => Object.values(st).reduce((w,s) => RANK[s]>RANK[w] ? s : w, 'green');
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = x => x==null ? '--' : Math.round(x);

/* ============ ENTRADA DE DATOS (única puerta) ============ */
function ingest(m){
  if(Array.isArray(m)) return m.forEach(ingest);
  const id = m && (m.astronaut_id || m.id);
  if(!id || !m.vitals) return;
  let a = S.crew.get(id);
  if(!a){
    a = {id, name:m.name||id, s:{}, last:{}, st:{}, ml:null, tri:'green'};
    VARS.forEach(v => a.s[v.k] = []);
    S.crew.set(id, a);
    if(!S.sel) S.sel = id;
    buildChips();
  }
  if(m.name) a.name = m.name;
  const ml = m.ml && typeof m.ml === 'object' && !Array.isArray(m.ml) ? m.ml : null;
  const flags = ml && ml.flags && typeof ml.flags === 'object' && !Array.isArray(ml.flags) ? ml.flags : {};
  VARS.forEach(v => {
    const x = Number(m.vitals[v.k]);
    if(!isFinite(x)) return;
    const arr = a.s[v.k]; arr.push(x); if(arr.length > CONFIG.window) arr.shift();
    a.last[v.k] = x;
    a.st[v.k] = isTri(flags[v.k]) ? flags[v.k] : rate(v,x);   // solo green/amber/red; si no, rangos
  });
  a.ml = ml;
  a.tri = ml && isTri(ml.triage) ? ml.triage : worst(a.st);   // triage desconocido => rangos
  S.last = Date.now();
  dirty = true; requestAnimationFrame(render);
}

/* ============ CONECTORES ============ */
let retry = 0;
function setConn(s,t){ $('#conn').dataset.s = s; $('#connT').textContent = t; }
function openWS(){
  setConn('wait','Conectando…');
  const w = new WebSocket(CONFIG.url);
  w.onopen = () => { retry = 0; setConn('ok','En vivo · WebSocket'); };
  w.onmessage = e => { try{ ingest(JSON.parse(e.data)); }catch(_){} };
  w.onclose = () => { setConn('bad','Reconectando…'); setTimeout(openWS, Math.min(15000, 500*2**retry++)); };
}
function mock(){
  setConn('demo','Modo demo · datos simulados');
  const crew = [['A-01','Ares'],['A-02','Selene'],['A-03','Vega']]; let t = 0;
  const tick = (ts) => { t++;
    crew.forEach(([id,name],i) => {
      const r = () => Math.random()-.5, st = Math.max(0, Math.sin((t+i*40)/45)) * i;
      ingest({astronaut_id:id, name, ts, vitals:{
        spo2:Math.min(100, 98 - st*5.5 + r()*1.2), hr:72 + st*34 + r()*5, rr:16 + st*7 + r()*1.5,
        urine:Math.max(0, 55 - st*30 + r()*6), bv:99 - st*14 + r()*1.2 }});
    });
  };
  for(let i=0;i<30;i++) tick(Date.now()-(30-i)*1000);
  setInterval(() => tick(Date.now()), 1000);
}

/* ============ INTERFAZ ============ */
const W=300, H=64, ref = {};
function buildCards(){
  $('#cards').innerHTML = VARS.map(v => `
    <button class="card" data-k="${v.k}" style="--c:#27457f">
      <div class="top"><span class="dot"></span><span class="nm">${v.name}</span>
        <span class="val">--</span><span class="un">${v.unit}</span></div>
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <rect class="band"/><path class="ar"/><path class="ln"/><line class="cur" y1="0" y2="${H}"/></svg>
      <span class="hv"></span>
    </button>`).join('');
  document.querySelectorAll('.card').forEach(c => {
    const k = c.dataset.k, svg = c.querySelector('svg');
    ref[k] = {c, val:c.querySelector('.val'), line:c.querySelector('.ln'), area:c.querySelector('.ar'),
              band:c.querySelector('.band'), cur:c.querySelector('.cur'), hv:c.querySelector('.hv')};
    c.onclick = () => pick(k);
    const move = e => {                      // al pasar el dedo/mouse muestra el valor de ese momento
      const a = S.crew.get(S.sel); if(!a) return;
      const arr = a.s[k], b = svg.getBoundingClientRect();
      const f = Math.min(1, Math.max(0, (e.clientX-b.left)/b.width));
      const back = Math.round((1-f)*(CONFIG.window-1)), idx = arr.length-1-back;
      if(idx<0) return;
      ref[k].cur.setAttribute('x1', f*W); ref[k].cur.setAttribute('x2', f*W); ref[k].cur.style.opacity = 1;
      ref[k].hv.textContent = fmt(arr[idx]) + ' · hace ' + back + ' s';
    };
    svg.onpointermove = move;
    svg.onpointerleave = () => { ref[k].cur.style.opacity = 0; ref[k].hv.textContent = ''; };
  });
  document.querySelectorAll('.z').forEach(z => z.onclick = () => pick(z.dataset.k));
}
function pick(k){ S.vk = k; dirty = true; render(); }

function buildChips(){
  $('#crew').innerHTML = [...S.crew.values()].map(a => `
    <button class="chip" data-id="${esc(a.id)}" aria-pressed="${a.id===S.sel}" style="--c:${COL[a.tri]}">
      <span class="dot"></span>${esc(a.name)} <small>${esc(a.id)}</small></button>`).join('');
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => { S.sel = c.dataset.id; buildChips(); dirty = true; render(); });
}

const yOf = (v,x) => H-4 - Math.min(1, Math.max(0, (x-v.min)/(v.max-v.min))) * (H-8);
function render(){
  if(!dirty) return; dirty = false;
  const a = S.crew.get(S.sel); if(!a) return;
  document.querySelectorAll('.chip').forEach(c => {
    const o = S.crew.get(c.dataset.id); c.style.setProperty('--c', COL[o.tri]); c.setAttribute('aria-pressed', o.id===S.sel);
  });
  VARS.forEach(v => {
    const r = ref[v.k], arr = a.s[v.k], col = COL[a.st[v.k]||'green'];
    r.c.style.setProperty('--c', col); r.c.classList.toggle('sel', v.k===S.vk);
    r.val.textContent = fmt(a.last[v.k]);
    const n = arr.length, pts = arr.map((x,i) => [W-(n-1-i)*W/(CONFIG.window-1), yOf(v,x)]);
    const d = pts.map((p,i) => (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    r.line.setAttribute('d', d);
    r.area.setAttribute('d', n ? d+` L${pts[n-1][0]} ${H} L${pts[0][0]} ${H} Z` : '');
    const top = yOf(v, Math.min(v.g[1], v.max)), bot = yOf(v, Math.max(v.g[0], v.min));
    r.band.setAttribute('x',0); r.band.setAttribute('width',W); r.band.setAttribute('y',top); r.band.setAttribute('height',Math.max(0,bot-top));
  });
  document.querySelectorAll('.z').forEach(z => {
    const k = z.dataset.k, s = a.st[k] || 'green';
    z.style.setProperty('--c', COL[s]); z.classList.toggle('red', s==='red'); z.classList.toggle('sel', k===S.vk);
  });
  const sv = VARS.find(v => v.k===S.vk);
  $('#cap').innerHTML = `<b>${sv.name}</b><br>${fmt(a.last[S.vk])} ${sv.unit} · zona: ${sv.zone}`;
  classify(a);
}

function findings(a){
  const out = [];
  VARS.forEach(v => {
    const s = a.st[v.k], x = a.last[v.k];
    if(!s || s==='green') return;
    const dir = x < v.g[0] ? 0 : 1, set = MSG[v.k][dir] || MSG[v.k][0];
    out.push({s, t:`<b>${v.name} ${fmt(x)} ${v.unit}.</b> ${set[s==='amber'?0:1]}`});
  });
  const L = a.last, st = a.st;
  if(L.hr>100 && L.bv<90) out.push({s:'red', t:'<b>Pulso alto + volumen bajo.</b> Patrón compatible con hipovolemia o sangrado.'});
  if(st.spo2!=='green' && L.rr>20) out.push({s:'red', t:'<b>SpO₂ baja + respiración acelerada.</b> Patrón de compromiso respiratorio.'});
  return out;
}
function classify(a){
  const box = $('#cls'); box.dataset.t = a.tri;
  $('#cbtnT').textContent = LABEL[a.tri];
  if(!S.open) return;
  const f = findings(a), ml = a.ml;
  $('#desc').innerHTML = `<h3>${LABEL[a.tri]}</h3>` +
    (ml && ml.label ? `<p>Modelo: ${esc(ml.label)}${ml.prob!=null ? ' (confianza '+Math.round(ml.prob*100)+'%)' : ''}</p>` : '') +
    (f.length ? '<ul>'+f.map(i => `<li style="--c:${COL[i.s]}"><i></i>${i.t}</li>`).join('')+'</ul>'
              : '<p>Todos los signos de ' + esc(a.name) + ' están dentro de rangos normales. Sin hallazgos que atender.</p>') +
    '<p class="note">Orientativo. No sustituye la valoración del equipo médico.</p>';
}
$('#cbtn').onclick = () => {
  S.open = !S.open; $('#cls').classList.toggle('open', S.open); $('#cbtn').setAttribute('aria-expanded', S.open);
  const a = S.crew.get(S.sel); if(a) classify(a);
};

/* Aviso si se corta el flujo de datos */
setInterval(() => {
  if(CONFIG.mode!=='mock' && S.last && Date.now()-S.last > CONFIG.staleMs) setConn('bad','Sin señal del backend');
}, 1000);

/* ============ INICIO ============ */
buildCards();
({mock, ws:openWS}[CONFIG.mode] || openWS)();
</script>
</body>
</html>
